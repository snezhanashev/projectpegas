image-scan:
  runs-on: ubuntu-latest
  needs: [build_docker]  # Зависит от этапа сборки Docker-образа

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Scan Docker image with Trivy (Critical/High)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "snezhanashev/projectpegas:${{ github.sha }}"
        format: "table"
        severity: "CRITICAL,HIGH"
        exit-code: "1"  # Блокирует пайплайн при Critical/High уязвимостях
        output: "trivy-image-report.txt"

    - name: Save JSON report (all severities)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "snezhanashev/projectpegas:${{ github.sha }}"
        format: "json"
        severity: "CRITICAL,HIGH,MEDIUM,LOW"
        output: "artifacts/trivy-image-report.json"

    - name: Upload Trivy report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-report
        path: artifacts/trivy-image-report.json

    - name: Archive scan results (for documentation)
      run: |
        cp trivy-image-report.txt artifacts/
        echo "Trivy scan completed. Report saved to artifacts/trivy-image-report.json"
